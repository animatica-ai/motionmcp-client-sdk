name: publish

# A tag `vX.Y.Z` on main is the release. The tag must name the version the
# package declares -- a mismatch fails the build before anything is uploaded,
# because PyPI never lets a version be replaced.
#
# Upload uses PyPI's trusted publishing (OIDC): no token lives in this repo.
# The publisher is configured on PyPI as owner `animatica-ai`, repository
# `motionmcp-client-sdk`, workflow `publish.yml`, environment `pypi`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: the tag names the declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          declared="$(python -c 'import motionmcp_client; print(motionmcp_client.__version__)')"
          tag="${GITHUB_REF_NAME#v}"
          test "$declared" = "$tag" || { echo "::error::tag v$tag but motionmcp_client.__version__ is $declared"; exit 1; }
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1
